name: Tests Pulp
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar fuentes y recursos
        run: npm run check
      - name: Ejecutar pruebas sin fondos ni proveedores reales
        run: npm test
