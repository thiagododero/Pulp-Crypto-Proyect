name: Tests Pulp 4.0
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar fuentes y sintaxis
        run: npm run check
      - name: Ejecutar pruebas de lógica e integraciones simuladas
        run: npm test
