name: Publicar Pulp · interfaz unificada
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'shared/**'
      - 'scripts/build-pages.mjs'
      - 'tests/presentation.test.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pulp-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar el proyecto y el bloqueo financiero
        run: |
          npm run check
          npm test
      - name: Construir la misma interfaz de la aplicación
        run: node scripts/build-pages.mjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir aplicación y recursos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4
