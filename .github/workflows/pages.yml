name: Publicar vista previa de Pulp
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pulp-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar vista previa estática
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Subir archivos de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4
