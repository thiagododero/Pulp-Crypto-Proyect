name: Publicar Pulp · interfaz unificada
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'shared/**'
      - 'scripts/build-pages.mjs'
      - 'tests/presentation.test.mjs'
      - 'tests/product*.test.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pulp-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar el proyecto y el bloqueo financiero
        run: |
          npm run check
          npm test
      - name: Construir la misma interfaz de la aplicación
        run: node scripts/build-pages.mjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir aplicación y recursos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Comprobar la URL publicada y sus recursos
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 "$base/build-info.json?v=$GITHUB_SHA" -o /tmp/pulp-build.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/pulp-build.json'));if(x.commit!==process.env.GITHUB_SHA||x.financialActions!==false||x.source!=='public/')process.exit(1);console.log('Commit y modo publicados verificados:',x.commit)"
          for asset in index.html js/runtime-mode.js js/app.mjs js/api.mjs js/views.mjs js/v4-ui.mjs js/product-model.mjs js/product-widgets.mjs js/product-ui.mjs js/presentation-api.mjs js/presentation-guard.js js/wallet.mjs js/layout.js shared/solana.mjs css/tokens.css css/components.css css/app.css css/v4.css css/responsive.css css/product.css assets/brand/pulp-icon.svg assets/white/pulp-hero.webp assets/white/pulp-trader.webp assets/white/scene-ecosystem.webp assets/white/scene-octopus.webp assets/white/scene-launch.webp; do
            curl --fail --silent --show-error --retry 3 --retry-all-errors "$base/$asset?v=$GITHUB_SHA" -o /tmp/pulp-resource
            test -s /tmp/pulp-resource
            echo "OK $asset"
          done
          mime=$(curl --fail --silent --show-error -I "$base/js/app.mjs?v=$GITHUB_SHA" | tr -d '\r' | grep -i '^content-type:')
          echo "$mime"
          echo "$mime" | grep -Eiq '(text|application)/javascript'
